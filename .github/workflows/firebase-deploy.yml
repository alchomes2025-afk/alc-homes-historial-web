name: Deploy to Firebase Hosting (Historial)

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting:historial --token "${{ secrets.FIREBASE_TOKEN }}" --project alc-homes-checkin
        
